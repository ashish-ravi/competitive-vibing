name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can import config modules. Pages are all
      # dynamic, so nothing here is ever contacted.
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      NEXTAUTH_SECRET: ci-secret-not-real-0000000000000000
      NEXTAUTH_URL: http://localhost:3000
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_ANON_KEY: ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      GROQ_API_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
